# ==============================================================================
# TechConnect Production Profile (application-prod.properties)
# Activated via SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

spring.application.name=techconnect-backend
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# PostgreSQL & HikariCP Production Connection Pool
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:techconnect_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${POSTGRES_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${POSTGRES_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${POSTGRES_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${POSTGRES_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${POSTGRES_MAX_LIFETIME:1200000}
spring.datasource.hikari.pool-name=TechConnectHikariProdPool

# ------------------------------------------------------------------------------
# JPA & Hibernate Production Tuning
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# MongoDB Knowledge Base Production Configuration
# ------------------------------------------------------------------------------
spring.data.mongodb.uri=${TECHCONNECT_MONGODB_URI:${MONGODB_URI:mongodb://${MONGODB_USER:techconnect_mongo_user}:${MONGODB_PASSWORD:postgres}@${MONGODB_HOST:mongodb}:${MONGODB_PORT:27017}/${MONGODB_DB:techconnect_knowledge}?authSource=admin}}
spring.data.mongodb.database=${TECHCONNECT_MONGODB_DATABASE:${MONGODB_DB:techconnect_knowledge}}

# ------------------------------------------------------------------------------
# JWT Authentication Production Parameters
# ------------------------------------------------------------------------------
security.jwt.secret=${TECHCONNECT_JWT_SECRET:${JWT_SECRET:}}
security.jwt.expiration-ms=${TECHCONNECT_JWT_EXPIRATION_MS:${JWT_EXPIRATION_MS:3600000}}

# ------------------------------------------------------------------------------
# CORS & Web Security
# ------------------------------------------------------------------------------
techconnect.cors.allowed-origins=${TECHCONNECT_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}}

# ------------------------------------------------------------------------------
# AI Microservice & RAG Client Timeouts
# ------------------------------------------------------------------------------
ai.service.url=${TECHCONNECT_AI_SERVICE_URL:${AI_SERVICE_URL:http://ai-service:8000}}
ai.service.timeout-ms=${TECHCONNECT_AI_SERVICE_TIMEOUT_MS:${AI_SERVICE_TIMEOUT_MS:5000}}
ai.copilot.timeout-ms=${TECHCONNECT_COPILOT_TIMEOUT_MS:${COPILOT_TIMEOUT_MS:10000}}
ai.resolution.timeout-ms=${TECHCONNECT_RESOLUTION_TIMEOUT_MS:${RESOLUTION_TIMEOUT_MS:10000}}

# ------------------------------------------------------------------------------
# Production Logging & Observability
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.techconnect=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ------------------------------------------------------------------------------
# Spring Boot Actuator Production Health Check Configuration
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ------------------------------------------------------------------------------
# Request Size & Multipart Boundaries
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10485760

# ------------------------------------------------------------------------------
# Baseline Seeding (Strictly Disabled in Production)
# ------------------------------------------------------------------------------
app.seed.dev-users=false
app.seed.dev-password=

# ------------------------------------------------------------------------------
# Rate Limiting Configuration
# ------------------------------------------------------------------------------
techconnect.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
techconnect.rate-limit.ai-rpm=${RATE_LIMIT_AI_REQUESTS_PER_MINUTE:20}
techconnect.rate-limit.search-rpm=${RATE_LIMIT_SEARCH_REQUESTS_PER_MINUTE:60}
techconnect.rate-limit.general-rpm=${RATE_LIMIT_GENERAL_REQUESTS_PER_MINUTE:120}
