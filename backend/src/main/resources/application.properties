# ==============================================================================
# TechConnect Backend Application Properties (Phase 2 Database Configuration)
# ==============================================================================

spring.application.name=techconnect-backend
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.techconnect=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# PostgreSQL Primary Relational Datasource
# Configured via environment variables; defaults to localhost:5432/techconnect_db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:techconnect_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Baseline Seeding (Development Only - Safe production default is false; supply TECHCONNECT_DEV_PASSWORD in env when enabled)
app.seed.dev-users=${TECHCONNECT_SEED_DEV_USERS:false}
app.seed.dev-password=${TECHCONNECT_DEV_PASSWORD:}

# JWT Authentication Configuration
security.jwt.secret=${TECHCONNECT_JWT_SECRET:}
security.jwt.expiration-ms=${TECHCONNECT_JWT_EXPIRATION_MS:3600000}

# SLA Configuration
sla.at-risk-threshold-percentage=0.20


