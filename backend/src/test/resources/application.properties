# ==============================================================================
# TechConnect Test Configuration (In-Memory H2 simulating PostgreSQL)
# ==============================================================================

spring.application.name=techconnect-backend-test

# H2 In-Memory DB in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:techconnect_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate in Test Environment
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Test Environment Seeding Configuration
app.seed.dev-users=true
app.seed.dev-password=TestPassOnlyInTests!2026

